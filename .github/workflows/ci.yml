name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        intellij: ['2023.3', 'LATEST-EAP-SNAPSHOT']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build plugin
        run: ./gradlew buildPlugin -Pintellij.version=${{ matrix.intellij }}
      - name: Run Plugin Verifier
        run: ./gradlew runPluginVerifier -Pintellij.version=${{ matrix.intellij }}
